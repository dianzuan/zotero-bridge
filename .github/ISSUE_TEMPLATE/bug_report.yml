name: Bug Report
description: Report a bug in zotron
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of zotron is affected?
      options:
        - CLI (zotron command)
        - XPI (Zotero plugin)
        - Claude Code / Codex plugin
        - Not sure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug, including the full command and error output.
      placeholder: |
        1. Run `zotron items get ABC12345`
        2. Error: ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
  - type: input
    id: zotron-version
    attributes:
      label: zotron Version
      description: Output of `zotron --version`
      placeholder: "e.g. 0.2.2"
    validations:
      required: true
  - type: input
    id: zotero-version
    attributes:
      label: Zotero Version
      placeholder: "e.g. 7.0.15"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g. Windows 11, macOS 15, Ubuntu 24.04"
    validations:
      required: true
