name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  xpi:
    name: Build XPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build XPI
        run: npm run build

      - name: Upload XPI artifact
        uses: actions/upload-artifact@v7
        with:
          name: zotron-xpi
          path: .scaffold/build/zotron.xpi

  binaries:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: zotron
            asset: zotron-linux-amd64
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: zotron
            asset: zotron-linux-arm64
            cross: true
          - name: macos-amd64
            os: macos-latest
            target: x86_64-apple-darwin
            binary: zotron
            asset: zotron-macos-amd64
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: zotron
            asset: zotron-macos-arm64
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: zotron.exe
            asset: zotron-windows-amd64.exe
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross (Linux ARM64)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --locked --release --target ${{ matrix.target }} -p zotron

      - name: Build (cross)
        if: matrix.cross
        run: cross build --locked --release --target ${{ matrix.target }} -p zotron

      - name: Rename binary
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    name: GitHub Release
    needs: [xpi, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Assert release versions match
        run: node scripts/assert-release-version.mjs

      - name: Collect release assets
        run: |
          mkdir release-assets
          cp artifacts/zotron-xpi/zotron.xpi release-assets/
          for dir in artifacts/zotron-*/; do
            [ -d "$dir" ] && cp "$dir"* release-assets/ 2>/dev/null || true
          done

          # Stamp update.json with the actual XPI hash
          HASH=$(sha512sum release-assets/zotron.xpi | awk '{print $1}')
          sed "s/sha512:[a-f0-9]*/sha512:${HASH}/" update.json > release-assets/update.json

          ls -la release-assets/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release-assets/* --generate-notes

      - name: Update latest release for auto-update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          gh release upload latest release-assets/update.json --clobber

  crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish zotron-types
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p zotron-types

      - name: Wait for crates.io to index
        run: sleep 30

      - name: Publish zotron-rpc
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p zotron-rpc

      - name: Wait for crates.io to index
        run: sleep 30

      - name: Publish zotron
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p zotron
