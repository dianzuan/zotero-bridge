name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  xpi:
    name: Build XPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build XPI
        run: npm run build

      - name: Upload XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: zotron-xpi
          path: .scaffold/build/zotron.xpi

  release:
    name: GitHub Release
    needs: xpi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download XPI artifact
        uses: actions/download-artifact@v4
        with:
          name: zotron-xpi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" zotron.xpi --generate-notes

  crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish zotron-types
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p zotron-types

      - name: Wait for crates.io to index
        run: sleep 30

      - name: Publish zotron-rpc
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p zotron-rpc

      - name: Wait for crates.io to index
        run: sleep 30

      - name: Publish zotron
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p zotron
