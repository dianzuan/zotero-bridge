name: Bug Report
description: Report a bug in zotron
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Run `zotron ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include error messages or output if available.
  - type: input
    id: zotero-version
    attributes:
      label: Zotero Version
      placeholder: "e.g. 7.0.15"
  - type: input
    id: zotron-version
    attributes:
      label: zotron Version
      placeholder: "e.g. 0.1.3"
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g. Windows 11, macOS 15, Ubuntu 24.04"
