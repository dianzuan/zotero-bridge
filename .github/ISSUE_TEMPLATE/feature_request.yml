name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see added or changed?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Why do you need this? Describe the problem or workflow it would improve.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: Show how you'd use this feature — a CLI invocation, expected output, or workflow.
      placeholder: |
        ```
        zotron search "attention mechanism" --after 2024 --collection MyProject
        ```
