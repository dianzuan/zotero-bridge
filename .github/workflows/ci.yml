name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  xpi:
    name: XPI (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run mocha tests
        run: npm test

      - name: Build XPI
        run: npm run build

  rust:
    name: Rust (CLI + Types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --locked --workspace

      - name: Test
        run: cargo test --locked --workspace

      - name: Clippy
        run: cargo clippy --locked --workspace -- -D warnings

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Assert release versions match
        run: node scripts/assert-release-version.mjs
        env:
          SKIP_TAG_CHECK: "1"
