<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
     xmlns:html="http://www.w3.org/1999/xhtml">

<groupbox>
  <label><html:h2 id="zotron-general-title">General</html:h2></label>
  <html:div class="zotron-grid">
    <label id="zotron-lang-label" class="z1" value="Language"/>
    <menulist id="zotron-language" class="z2">
      <menupopup>
        <menuitem id="zotron-lang-en" label="English" value="en-US"/>
        <menuitem id="zotron-lang-zh" label="Chinese" value="zh-CN"/>
      </menupopup>
    </menulist>
  </html:div>
</groupbox>

<groupbox>
  <label><html:h2 id="zotron-ocr-title">OCR</html:h2></label>
  <html:div class="zotron-grid">
    <label id="zotron-ocr-provider-label" class="z1" value="Provider"/>
    <menulist id="zotron-ocr-provider" class="z2">
      <menupopup>
        <menuitem label="GLM-OCR" value="glm"/>
        <menuitem label="PaddleOCR-VL" value="paddle"/>
        <menuitem label="MinerU" value="mineru"/>
        <menuitem label="Custom OCR" value="custom"/>
      </menupopup>
    </menulist>
    <label id="zotron-ocr-key-label" class="z1" value="API Key"/>
    <html:input id="zotron-ocr-apikey" class="z2 z-input" type="password"></html:input>
    <button id="zotron-ocr-test" class="z3" label="Test"/>
    <html:div id="zotron-ocr-hintrow" class="zspan zotron-hintrow">
      <html:span id="zotron-ocr-status" class="zotron-status"></html:span>
    </html:div>
    <label id="zotron-ocr-model-label" class="z1" value="Model"/>
    <html:input id="zotron-ocr-model" class="z2 z-input" type="text"></html:input>
    <label id="zotron-ocr-url-label" class="z1" value="API URL"/>
    <html:input id="zotron-ocr-apiurl" class="z2 z-input" type="text"></html:input>
  </html:div>
</groupbox>

<groupbox>
  <label><html:h2 id="zotron-emb-title">Embedding</html:h2></label>
  <html:div class="zotron-grid">
    <label id="zotron-emb-provider-label" class="z1" value="Provider"/>
    <menulist id="zotron-emb-provider" class="z2">
      <menupopup>
        <menuitem label="Ollama" value="ollama"/>
        <menuitem label="OpenAI" value="openai"/>
        <menuitem label="Volcengine" value="volcengine"/>
        <menuitem label="DashScope" value="dashscope"/>
        <menuitem label="Zhipu" value="zhipu"/>
        <menuitem label="Jina" value="jina"/>
        <menuitem label="SiliconFlow" value="siliconflow"/>
        <menuitem label="Voyage" value="voyage"/>
        <menuitem label="Cohere" value="cohere"/>
        <menuitem label="Custom" value="custom"/>
      </menupopup>
    </menulist>
    <label id="zotron-emb-key-label" class="z1" value="API Key"/>
    <html:input id="zotron-emb-apikey" class="z2 z-input" type="password"></html:input>
    <button id="zotron-emb-test" class="z3" label="Test"/>
    <html:div id="zotron-emb-hintrow" class="zspan zotron-hintrow">
      <html:span id="zotron-emb-status" class="zotron-status"></html:span>
    </html:div>
    <label id="zotron-emb-model-label" class="z1" value="Model"/>
    <html:input id="zotron-emb-model" class="z2 z-input" type="text"></html:input>
    <label id="zotron-emb-url-label" class="z1" value="API URL"/>
    <html:input id="zotron-emb-apiurl" class="z2 z-input" type="text"></html:input>
  </html:div>
</groupbox>

<groupbox>
  <label><html:h2 id="zotron-rerank-title">Reranker</html:h2></label>
  <html:div class="zotron-grid">
    <label id="zotron-rerank-provider-label" class="z1" value="Provider"/>
    <menulist id="zotron-rerank-provider" class="z2">
      <menupopup>
        <menuitem label="Jina" value="jina"/>
        <menuitem label="Cohere" value="cohere"/>
        <menuitem label="Voyage" value="voyage"/>
        <menuitem label="DashScope" value="dashscope"/>
        <menuitem label="SiliconFlow" value="siliconflow"/>
        <menuitem label="Custom" value="openai-compatible"/>
      </menupopup>
    </menulist>
    <label id="zotron-rerank-key-label" class="z1" value="API Key"/>
    <html:input id="zotron-rerank-apikey" class="z2 z-input" type="password"></html:input>
    <button id="zotron-rerank-test" class="z3" label="Test"/>
    <html:div id="zotron-rerank-hintrow" class="zspan zotron-hintrow">
      <html:span id="zotron-rerank-status" class="zotron-status"></html:span>
    </html:div>
    <label id="zotron-rerank-model-label" class="z1" value="Model"/>
    <html:input id="zotron-rerank-model" class="z2 z-input" type="text"></html:input>
    <label id="zotron-rerank-url-label" class="z1" value="API URL"/>
    <html:input id="zotron-rerank-url" class="z2 z-input" type="text"></html:input>
  </html:div>
</groupbox>

<groupbox>
  <html:details id="zotron-rag-details">
    <html:summary>
      <html:span id="zotron-rag-title" class="zotron-summary-title">Advanced RAG</html:span>
      <html:span id="zotron-rag-preview" class="zotron-summary-preview"></html:span>
    </html:summary>
    <html:div class="zotron-grid zotron-details-body">
      <label id="zotron-rag-chunk-label" class="z1" value="Chunk Size"/>
      <html:div class="z2 zotron-numrow">
        <html:input id="zotron-rag-chunksize" class="z-num" type="number"></html:input>
        <html:span id="zotron-rag-chunk-unit" class="zotron-unit">chars</html:span>
      </html:div>
      <label id="zotron-rag-overlap-label" class="z1" value="Chunk Overlap"/>
      <html:div class="z2 zotron-numrow">
        <html:input id="zotron-rag-overlap" class="z-num" type="number"></html:input>
        <html:span id="zotron-rag-overlap-unit" class="zotron-unit">chars</html:span>
      </html:div>
      <label id="zotron-rag-topk-label" class="z1" value="Top-K"/>
      <html:div class="z2 zotron-numrow">
        <html:input id="zotron-rag-topk" class="z-num" type="number"></html:input>
      </html:div>
      <label id="zotron-rag-mode-label" class="z1" value="Retrieval Mode"/>
      <menulist id="zotron-rag-mode" class="z2">
        <menupopup>
          <menuitem label="Hybrid (BM25 + Vector)" value="hybrid"/>
          <menuitem label="Dense (Vector Only)" value="dense"/>
          <menuitem label="Lexical (Keyword Only)" value="lexical"/>
        </menupopup>
      </menulist>
    </html:div>
  </html:details>
</groupbox>

<groupbox>
  <label><html:h2 id="zotron-src-title">Data Sources</html:h2></label>
  <html:div class="zotron-grid">
    <label class="z1" value="OpenAlex"/>
    <label id="zotron-src-openalex-note" class="z2 zotron-ok-note" value="✓ no key needed"/>
    <label class="z1" value="CrossRef"/>
    <label id="zotron-src-crossref-note" class="z2 zotron-ok-note" value="✓ no key needed"/>
    <label id="zotron-src-core-label" class="z1" value="CORE Key"/>
    <html:input id="zotron-src-core-key" class="z2 z-input" type="password"></html:input>
    <label id="zotron-src-mailto-label" class="z1" value="Contact email"/>
    <html:input id="zotron-src-mailto" class="z2 z-input" type="text" placeholder="you@example.org"></html:input>
    <html:div class="zspan zotron-hintrow">
      <html:span id="zotron-src-mailto-hint" class="zotron-hint"></html:span>
    </html:div>
  </html:div>
</groupbox>

</vbox>
